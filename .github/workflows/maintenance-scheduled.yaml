name: Scheduled Component File Update

on:
  # Daily at 2:01AM https://crontab.guru/
  schedule:
  - cron: '1 2 * * *'

jobs:
  maintenance_updates:
  runs-on: ubuntu-latest
env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

steps:
  - name: Checkout repo (existing branch)
uses: actions/checkout@v6
id: bad-checkout
continue-on-error: true
with:
  ref: maintenance-branch
# If the first checkout fails, we checkout the `develop` branch by default
- name: Fallback to default branch
if: steps.bad-checkout.outcome == 'failure'
uses: actions/checkout@v6
with:
  ref: ${{ github.head_ref }}

- name: Setup R
uses: r-lib/actions/setup-r@v2
with:
  use-public-rspm: true

- name: Install dependencies
uses: r-lib/actions/setup-r-dependencies@v2

- name: Install rExpertQuery package
run: |
  install.packages("remotes")
library(remotes)
remotes::install_github("USEPA/rExpertQuery", ref = "develop", dependencies = TRUE, force = TRUE)
shell: Rscript {0}

- name: Update ATTAINS domain values
run: |
  library(rExpertQuery)
rExpertQuery:::EQ_UpdateDomainValues()
shell: Rscript {0}

- name: Commit updated internal ref
uses: EndBug/add-and-commit@v10
with:
  author_name: 'github-actions[bot]'
author_email: 'github-actions[bot]@users.noreply.github.com'
message: "Update example data"
add: '[./data/*]'
new_branch: maintenance-branch
