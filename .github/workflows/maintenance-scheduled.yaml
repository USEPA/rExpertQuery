name: Scheduled Component File Update

on:
  schedule:
    - cron: '1 2 * * *' # daily at 2:01 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance_updates:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        id: checkout-maintenance
        continue-on-error: true
        with:
          ref: maintenance-branch
          fetch-depth: 0
          persist-credentials: true

      - name: Fallback to develop
        if: steps.checkout-maintenance.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Install rExpertQuery package
        run: |
          install.packages("remotes")
          library(remotes)
          remotes::install_github(
            "USEPA/rExpertQuery",
            ref = "develop",
            dependencies = TRUE,
            force = TRUE
          )
        shell: Rscript {0}

      - name: Update ATTAINS domain values
        run: |
          library(rExpertQuery)
          rExpertQuery:::EQ_UpdateInternalDomainValues(
            api_key = Sys.getenv("EQ_API_KEY")
          )
        shell: Rscript {0}

      - name: Commit updated data
        uses: EndBug/add-and-commit@v10
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "chore: update ATTAINS domain values"
          add: ./data/ATTAINSDomainValues.rda
          new_branch: maintenance-branch
