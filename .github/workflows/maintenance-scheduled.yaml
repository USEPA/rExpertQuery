name: Scheduled Component File Update

on:
  schedule:
    - cron: '1 2 * * *' # daily at 2:01 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance_updates:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: develop

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Install rExpertQuery package
        run: |
          install.packages("remotes")
          remotes::install_github(
            "USEPA/rExpertQuery",
            ref = "develop",
            dependencies = TRUE,
            force = TRUE
          )
        shell: Rscript {0}

      - name: Update ATTAINS domain values
        run: |
          library(rExpertQuery)
          rExpertQuery:::EQ_UpdateDomainValues()
        shell: Rscript {0}

      - name: Create branch and commit changes
        id: commit
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TS=$(date -u +'%Y%m%d-%H%M%S')
          BRANCH="chore/update-component-${TS}"

          git checkout -b "$BRANCH"
          git add -A data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update component data"
          git push -u origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: develop
        run: |
          set -e

          TITLE="chore: update component data"
          BODY="Automated update of component/internal data files."

          gh pr create \
            --repo "$GH_REPO" \
            --head "${{ steps.commit.outputs.branch }}" \
            --base "$BASE_BRANCH" \
            --title "$TITLE" \
            --body "$BODY" \
            || echo "PR may already exist"
