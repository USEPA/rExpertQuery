name: Component File Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance_updates:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ref: ${{ github.ref_name }}  # optional; omit to use the ref that triggered the run

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Install rExpertQuery package
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_github(
            "USEPA/rExpertQuery",
            ref = "develop",
            dependencies = TRUE,
            force = TRUE
          )

      - name: Update ATTAINS domain values
        shell: Rscript {0}
        run: |
          library(rExpertQuery)
          rExpertQuery:::EQ_UpdateDomainValues()

      - name: Commit updated internal ref data
        uses: EndBug/add-and-commit@v10
        with:
          author_name: 'github-actions[bot]'
          author_email: 'github-actions[bot]@users.noreply.github.com'
          message: "chore: Update example data [skip ci]"
          add: './data/*'
