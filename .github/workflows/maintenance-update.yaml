name: Scheduled Component File Update

on:
  # Daily at 2:01 AM UTC
  schedule:
    - cron: '1 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance_updates:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

    steps:
      - name: Checkout maintenance branch (if exists)
        id: checkout_maint
        uses: actions/checkout@v4
        with:
          ref: maintenance-branch
          fetch-depth: 0
        continue-on-error: true

      - name: Fallback to develop branch
        if: ${{ steps.checkout_maint.outcome == 'failure' }}
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Install rExpertQuery package
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_github(
            "USEPA/rExpertQuery",
            ref = "develop",
            dependencies = TRUE,
            force = TRUE
          )

      - name: Update ATTAINS domain values
        shell: Rscript {0}
        run: |
          library(rExpertQuery)
          rExpertQuery:::EQ_UpdateDomainValues()

      - name: Commit updated internal ref
        uses: EndBug/add-and-commit@v10
        with:
          author_name: 'github-actions[bot]'
          author_email: '41898282+github-actions[bot]@users.noreply.github.com'
          message: "chore: Update example data [skip ci]"
          add: './data/*'
          new_branch: maintenance-branch
