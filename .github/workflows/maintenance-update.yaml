name: Component File Update

on:
  #  pull_request:
  #    branches:
  #      [develop]
  workflow_dispatch:

  jobs:
  maintenance_updates:
  runs-on: ubuntu-latest
env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
EQ_API_KEY: ${{ secrets.EQ_API_KEY }}

steps:
  - name: Checkout repo
    uses: actions/checkout@v6
    with:
      ref: ${{ github.head_ref }}

  - name: Setup R
    uses: r-lib/actions/setup-r@v2
    with:
    use-public-rspm: true

  - name: Install dependencies
    uses: r-lib/actions/setup-r-dependencies@v2

  - name: Install rExpertQuery package
    run: |
      install.packages("remotes")
      library(remotes)
      remotes::install_github("USEPA/rExpertQuery", ref = "develop", dependencies = TRUE, force = TRUE)
    shell: Rscript {0}

  - name: Update ATTAINS domain values
    run: |
      library(rExpertQuery)
      rExpertQuery:::EQ_UpdateDomainValues()
    shell: Rscript {0}

  - name: Commit updated internal ref data
    uses: EndBug/add-and-commit@v10
    with:
      author_name: 'github-actions[bot]'
      author_email: 'github-actions[bot]@users.noreply.github.com'
      message: "Update example data"
      add: '[./data/*]'

#      - uses: pre-commit/action@v3.0.1
#        with:
#          extra_args: --files = '[./data/*, ./inst/extdata/*]'
