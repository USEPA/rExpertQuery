name: Update test mocks

on:
  schedule:
    - cron: '0 8 1 * *' # first day of every month at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-test-mocks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httptest2
            any::withr
            any::testthat
            any::data.table
            any::dplyr
            .

      - name: Run script to update mocks
        run: Rscript dev/record-mocks-httptest2.R

      - name: Create branch and commit changes
        id: commit
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TS=$(date -u +'%Y%m%d-%H%M%S')
          BRANCH="chore/update-mocks-${TS}"

          git checkout -b "$BRANCH"
          git add -A tests/testthat/htt2

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update test mocks"
          git push -u origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: develop
        run: |
          set -e

          TITLE="chore: update test mocks"
          BODY="Automated update of recorded httptest2 fixtures."

          gh pr create \
            --repo "$GH_REPO" \
            --head "${{ steps.commit.outputs.branch }}" \
            --base "$BASE_BRANCH" \
            --title "$TITLE" \
            --body "$BODY" \
            || echo "PR may already exist"
